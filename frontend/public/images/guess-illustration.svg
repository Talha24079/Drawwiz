<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bulbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Lightbulb body -->
  <ellipse cx="150" cy="120" rx="55" ry="70" fill="url(#bulbGrad)" opacity="0.9"/>
  
  <!-- Light rays -->
  <line x1="150" y1="40" x2="150" y2="10" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <line x1="115" y1="60" x2="95" y2="40" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <line x1="185" y1="60" x2="205" y2="40" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <line x1="95" y1="100" x2="65" y2="100" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <line x1="205" y1="100" x2="235" y2="100" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Base of bulb -->
  <rect x="130" y="180" width="40" height="15" fill="#94a3b8"/>
  <rect x="125" y="195" width="50" height="8" fill="#64748b"/>
  <rect x="130" y="203" width="40" height="8" fill="#64748b"/>
  
  <!-- Question marks floating around -->
  <text x="70" y="160" font-size="30" fill="#a855f7" font-weight="bold" opacity="0.7">?</text>
  <text x="210" y="150" font-size="35" fill="#3b82f6" font-weight="bold" opacity="0.7">?</text>
  <text x="130" y="250" font-size="28" fill="#ec4899" font-weight="bold" opacity="0.7">?</text>
  
  <!-- Sparkles around bulb -->
  <circle cx="120" cy="85" r="3" fill="#ffffff"/>
  <circle cx="180" cy="90" r="3" fill="#ffffff"/>
  <circle cx="150" cy="70" r="2" fill="#ffffff"/>
  <circle cx="165" cy="120" r="2" fill="#ffffff"/>
</svg>
