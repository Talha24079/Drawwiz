<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="trophyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Trophy base -->
  <rect x="110" y="220" width="80" height="20" rx="4" fill="#94a3b8"/>
  <rect x="130" y="200" width="40" height="25" fill="#64748b"/>
  
  <!-- Trophy cup -->
  <path d="M 100 70 L 90 150 Q 90 180 150 180 Q 210 180 210 150 L 200 70 Z" fill="url(#trophyGrad)"/>
  
  <!-- Trophy handles -->
  <path d="M 90 90 Q 60 90 60 120 Q 60 140 80 140 L 90 120" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
  <path d="M 210 90 Q 240 90 240 120 Q 240 140 220 140 L 210 120" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Top rim -->
  <ellipse cx="150" cy="70" rx="50" ry="10" fill="#fbbf24"/>
  
  <!-- Star on trophy -->
  <path d="M 150 110 L 157 127 L 175 130 L 162 143 L 165 161 L 150 153 L 135 161 L 138 143 L 125 130 L 143 127 Z" fill="#ffffff" opacity="0.8"/>
  
  <!-- Confetti -->
  <rect x="70" y="40" width="8" height="8" fill="#ef4444" opacity="0.7" transform="rotate(45 74 44)"/>
  <rect x="220" y="50" width="8" height="8" fill="#3b82f6" opacity="0.7" transform="rotate(30 224 54)"/>
  <circle cx="85" cy="170" r="4" fill="#22c55e" opacity="0.7"/>
  <circle cx="215" cy="165" r="4" fill="#a855f7" opacity="0.7"/>
  <rect x="230" y="130" width="6" height="6" fill="#ec4899" opacity="0.7" transform="rotate(60 233 133)"/>
  <circle cx="65" cy="120" r="3" fill="#fbbf24" opacity="0.7"/>
</svg>
