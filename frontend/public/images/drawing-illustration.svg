<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)"/>
  
  <!-- Canvas/Easel -->
  <rect x="80" y="50" width="240" height="180" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  
  <!-- Drawing on canvas - simple smiley face -->
  <circle cx="200" cy="120" r="40" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <circle cx="185" cy="110" r="5" fill="#1e293b"/>
  <circle cx="215" cy="110" r="5" fill="#1e293b"/>
  <path d="M 180 135 Q 200 150 220 135" stroke="#1e293b" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Color palette -->
  <rect x="100" y="245" width="200" height="30" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="130" cy="260" r="8" fill="#ef4444"/>
  <circle cx="160" cy="260" r="8" fill="#3b82f6"/>
  <circle cx="190" cy="260" r="8" fill="#22c55e"/>
  <circle cx="220" cy="260" r="8" fill="#eab308"/>
  <circle cx="250" cy="260" r="8" fill="#a855f7"/>
  <circle cx="270" cy="260" r="8" fill="#ec4899"/>
  
  <!-- Paintbrush -->
  <path d="M340 220 L355 235 L365 225 L350 210 Z" fill="#fbbf24"/>
  <rect x="345" y="200" width="10" height="20" rx="2" fill="#1e293b" transform="rotate(-45 350 210)"/>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="80" r="15" fill="#fbbf24" opacity="0.3"/>
  <circle cx="360" cy="60" r="20" fill="#a855f7" opacity="0.3"/>
  <circle cx="370" cy="180" r="12" fill="#3b82f6" opacity="0.3"/>
</svg>
