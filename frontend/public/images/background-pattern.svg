<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="pattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Dots pattern -->
      <circle cx="10" cy="10" r="2" fill="#e0e7ff" opacity="0.5"/>
      <circle cx="50" cy="10" r="2" fill="#dbeafe" opacity="0.5"/>
      <circle cx="90" cy="10" r="2" fill="#fce7f3" opacity="0.5"/>
      
      <circle cx="30" cy="30" r="2" fill="#e0e7ff" opacity="0.5"/>
      <circle cx="70" cy="30" r="2" fill="#dbeafe" opacity="0.5"/>
      
      <circle cx="10" cy="50" r="2" fill="#fce7f3" opacity="0.5"/>
      <circle cx="50" cy="50" r="2" fill="#e0e7ff" opacity="0.5"/>
      <circle cx="90" cy="50" r="2" fill="#dbeafe" opacity="0.5"/>
      
      <circle cx="30" cy="70" r="2" fill="#dbeafe" opacity="0.5"/>
      <circle cx="70" cy="70" r="2" fill="#fce7f3" opacity="0.5"/>
      
      <circle cx="10" cy="90" r="2" fill="#dbeafe" opacity="0.5"/>
      <circle cx="50" cy="90" r="2" fill="#fce7f3" opacity="0.5"/>
      <circle cx="90" cy="90" r="2" fill="#e0e7ff" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#pattern)"/>
</svg>
